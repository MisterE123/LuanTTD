name: LuanTTD tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lua and headless Luanti
    runs-on: ubuntu-24.04
    container: debian:13
    env:
      LUA: lua5.1
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - name: Install test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git lua5.1 luanti luanti-server python3 python3-pil zstd xvfb x11-utils xauth xdotool imagemagick
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Lua syntax and run focused tests
        run: |
          find mods/luanttd_core -type f -name '*.lua' -print0 | xargs -0 -r -n 1 luac5.1 -p
          for t in sim pedestrian avatar_car player_return cinematic_view ambient_wildlife wildlife_motion world_place_labels ambient_shop_traffic survey_sightseeing campaign_landscape_async campaign_simulation_bindings campaign_company_guide campaign_authority_endpoint campaign_authority_projection campaign_authority_interest campaign_projection_painter campaign_paint_tops campaign_snapshot_scene campaign_authority_host campaign_build_proxy campaign_projected_actors campaign_passenger_projection campaign_worker_finance_ui campaign_news_road campaign_worker_depot_ui campaign_worker_fleet_ui authority_terrain_view campaign_transport_commands presentation_interest world_setup generated_world_dimensions packed_campaign workbench_index business_tutorials original_terrain_explorer_gate jump_map atmosphere industry_smoke_view hotbar vehicle_ui road_live_order_edit tram_live_order_edit water_air_orders ordinary_level_crossing road_remove_long road_remove_world tram_remove_world tram_drag tram_grade_surface tram_grade_service tram_span_layers road_town_permission road_stop_build_rc1 road_stop_area road_stop_members road_stop_area_route road_stop_area_worker road_auto_terminal road_facility_underpasses road_mixed_station road_station_retirement station_join_picker road_waypoint_build road_waypoint_service \
            bridge_picker bridge_underlay bridge_piece_art road_bridge_upgrade rail_span rail_span_run rail_bridge_catenary_selector generated_coast_dock \
            coastal_corridor_seed coastal_corridor_freight generated_oil_placement mixed_freight_live farm_field_view rail_owned_default \
            rail_depot_fleet rail_depot_construction rail_loose_wagons rail_order_cargo rail_owned_ui rail_goods_owned_ui rail_oil_world_ui rail_grade_signals \
            road_bay_live road_terminus_town_limits rail_owned_service rail_owned_multi rail_paid_runtime rail_signal_ui rail_signal_curve rail_block_signals rail_block_dispatch rail_reverse rail_collision rail_accident_rating rail_station_placement rail_preview rail_diagonal rail_body_spacing rail_dispatch_view passenger_crowd passenger_terminal_crowd ship_preview_view; do
            lua5.1 "tests/$t.lua"
          done
          for t in rail_guideway_bogies rail_advanced_stock_purchase rail_typed_construction_runtime rail_gauge_conversion; do
            lua5.1 "tests/$t.lua"
          done
          lua5.1 tests/road_proximity.lua
          lua5.1 tests/stock_road_coast.lua
          lua5.1 tests/road_traffic_runtime.lua
          lua5.1 tests/tram_preview_run.lua
          lua5.1 tests/tram_shared_road_live.lua
          lua5.1 tests/tram_shared_station.lua
          LUANTTD_TEST_TRAM_FLEET=1 lua5.1 tests/tram_shared_station.lua
          lua5.1 tests/tram_dedicated_station.lua
          LUANTTD_TEST_TRAM_MIXED=1 lua5.1 tests/tram_dedicated_station.lua
          LUANTTD_TEST_TRAM_ROAD_ACCESS=1 lua5.1 tests/tram_dedicated_station.lua
          LUANTTD_TEST_TRAM_ROAD_ACCESS=1 LUANTTD_TEST_TRAM_MIXED=1 lua5.1 tests/tram_dedicated_station.lua
          lua5.1 tests/tram_station_cargo.lua
          lua5.1 tests/road_dead_end.lua
          lua5.1 tests/road_transit_depot.lua
          lua5.1 tests/monorail_owned_runtime.lua
          lua5.1 tests/monorail_owned_runtime.lua spans
          python3 tests/fast_girder_art.py
          python3 tests/concrete_suspension_art.py
          python3 tests/steel_cantilever_art.py
          python3 tests/short_rail_bridge_art.py
          python3 tests/advanced_guideway_art.py
          python3 tests/advanced_rail_facility_art.py
          python3 tests/stock_x2001_art.py
          python3 tests/monorail_span_art.py
          python3 tests/monorail_span_art.py maglev
          python3 tests/stock_lev1_art.py
          python3 tests/guideway_tanker_art.py
          python3 tools/build_tram_grade_art.py --check
          python3 tests/stock_millennium_art.py
          lua5.1 tests/rail_exhaust.lua
          lua5.1 tests/terrain_tile_lookup.lua
          lua5.1 tests/tunnel_bore.lua
          lua5.1 tests/vehicle_ride.lua
          lua5.1 tests/sightseeing_flight.lua
          lua5.1 tests/sightseeing_plane_effects.lua
          python3 tests/ride_interior_art.py
          python3 tests/wildlife_art.py
          python3 tests/road_waypoint_art.py
          lua5.1 tests/farm_rc1_native_board.lua
          lua5.1 tests/farm_livestock_view.lua
          lua5.1 tests/coastal_corridor_freight.lua --async-tape
          lua5.1 tests/road_timber_live.lua craighead
          lua5.1 tests/road_timber_live.lua wood_foster
          lua5.1 tests/road_timber_live.lua wood_moreland
          lua5.1 tests/farm_workbench_live.lua mid
          lua5.1 tests/farm_workbench_live.lua late
          lua5.1 tests/road_stock_market.lua superbus
          python3 tests/recovered_road_stock_art.py
          python3 tests/stock_late_freight_art.py
          lua5.1 tests/road_coal_live.lua coal_uhl
          lua5.1 tests/road_coal_live.lua coal_dw
          lua5.1 tests/oil_workbench_live.lua mid
          lua5.1 tests/oil_workbench_live.lua late
          for model in mail_mps mail_reynard mail_perry; do lua5.1 tests/road_mail_service.lua "$model"; done
          python3 tests/stock_late_industry_art.py
          python3 tests/stock_road_fleet_d_art.py
          python3 tests/stock_mail_companions_art.py
          lua5.1 tests/rail_owned_service.lua signal_free
          lua5.1 tests/rail_owned_service.lua depot_turnout
          lua5.1 tests/rail_owned_service.lua mixed_signals
          lua5.1 tests/rail_owned_service.lua two_coaches
          lua5.1 tests/rail_owned_service.lua sh_125
          lua5.1 tests/shared_mail_station_allocator.lua
          lua5.1 tests/stock_rail_mail_service.lua
          lua5.1 tests/stock_mixed_town_rail_service.lua
          lua5.1 tests/stock_aircraft_mail_service.lua
          lua5.1 tests/stock_rail_multi_ore_service.lua
          lua5.1 tests/rail_copy_order_list.lua
          lua5.1 tests/rail_electric_roster.lua
          python3 tests/stock_rail_f_art.py
          python3 tests/stock_dash_art.py
          python3 tests/stock_tim_art.py
          python3 tests/stock_tim_art.py --variant asiastar
          python3 tests/yate_haugan_art.py
          lua5.1 tests/rail_owned_service.lua three_stops
          lua5.1 tests/rail_owned_service.lua live_orders
          lua5.1 tests/rail_owned_service.lua live_pbs_orders
          lua5.1 tests/rail_owned_service.lua spans_unreserved
          lua5.1 tests/rail_owned_multi.lua shared_depot
          lua5.1 tests/rail_owned_multi.lua collision
          lua5.1 tests/rail_owned_multi.lua live_construction
          lua5.1 tests/stock_town_art.lua
          lua5.1 tests/stock_town_construction.lua
          lua5.1 tests/town_fountain_view.lua
          python3 tests/stock_town_art.py
          python3 tests/stock_farm_factory_art.py
          python3 tests/stock_town_construction_art.py
          python3 tests/landscape_visit_rc1.py
          python3 tests/rail_diagonal_art.py
          python3 tests/rail_signal_art.py
          python3 tests/rail_architecture.py
          lua5.1 tests/lighthouse_beam_view.lua
          python3 tests/rail_art.py
          for ship in 206 207; do lua5.1 tests/rail_paid_runtime.lua "$ship"; done

  native-regressions:
    name: Native world checks (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 15
    env:
      LUA: lua5.1
    strategy:
      fail-fast: false
      matrix:
        suite: [startup, stock-rail, industry-air-and-water, rail-dispatch, airport-rotor]
    defaults:
      run:
        shell: bash
    steps:
      - name: Install native test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gcc libc6-dev lua5.1 luanti luanti-server python3 python3-pil zstd xvfb x11-utils xauth xdotool imagemagick
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run native regression shard
        env:
          NATIVE_SUITE: ${{ matrix.suite }}
        run: bash .github/scripts/native-regressions.sh "$NATIVE_SUITE"

  native-interaction:
    name: Focus recovery and private native rides
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - name: Install graphical replay tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gcc libc6-dev luanti luanti-server python3 python3-pil xvfb x11-utils xauth xdotool imagemagick
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Replay focus loss, paid bus arrival and process reopen
        run: |
          export PATH="/usr/games:$PATH"
          export TMPDIR="$(mktemp -d "$GITHUB_WORKSPACE/.native-ui.XXXXXX")"
          trap 'rm -rf -- "$TMPDIR"' EXIT
          export LUANTTD_NATIVE_MEDIA_CACHE="$TMPDIR/cache"
          python3 tests/cache_luanti_game_media.py . "$LUANTTD_NATIVE_MEDIA_CACHE"
          bash tests/road_placement_latency_native.sh
          LUANTTD_NATIVE_BENCH_REMOVE=1 bash tests/road_placement_latency_native.sh
          LUANTTD_NATIVE_COAST_ROAD=1 bash tests/road_placement_latency_native.sh
          bash tests/place_labels_worker_native.sh
          BAYLINE_NATIVE_DISPLAY=313 bash tests/place_labels_graphical.sh
          BAYLINE_NATIVE_TCP=1 BAYLINE_NATIVE_DISPLAY=312 BAYLINE_NATIVE_PORT=46712 BAYLINE_NATIVE_BRIDGE_ROAD_CLEAR=1 LUANTTD_NATIVE_BRIDGE_GROUND_STOP=1 timeout 190 bash tests/bridge_pier_render_native.sh
          BAYLINE_NATIVE_TCP=1 BAYLINE_NATIVE_DISPLAY=314 BAYLINE_NATIVE_PORT=46714 LUANTTD_NATIVE_TRAM_GRADE=1 timeout 190 bash tests/bridge_pier_render_native.sh
          BAYLINE_NATIVE_TCP=1 BAYLINE_NATIVE_DISPLAY=315 BAYLINE_NATIVE_PORT=46715 LUANTTD_NATIVE_TRAM_SPAN=1 timeout 190 bash tests/bridge_pier_render_native.sh
          LUANTTD_NATIVE_ROAD_GESTURES=1 LUANTTD_NATIVE_ROAD_MUNICIPAL=1 LUANTTD_NATIVE_EXPLICIT_FACILITIES=1 LUANTTD_NATIVE_EXPLICIT_FACILITY_UI=1 LUANTTD_NATIVE_WAYPOINT=1 LUANTTD_NATIVE_WAYPOINT_REUSE=1 LUANTTD_NATIVE_STOP_AREA=1 LUANTTD_NATIVE_STOP_JOIN=1 LUANTTD_NATIVE_STOP_MIX=1 LUANTTD_NATIVE_STOP_AUTO=1 LUANTTD_NATIVE_TRAM_REMOVE=1 LUANTTD_NATIVE_TRAM_DRAG=1 BAYLINE_NATIVE_DISPLAY=307 timeout 220 bash tests/campaign_worker_focus_native.sh
          BAYLINE_NATIVE_DISPLAY=309 BAYLINE_FOCUS_DEAD_END=1 timeout 220 bash tests/campaign_worker_focus_native.sh
          BAYLINE_NATIVE_DISPLAY=316 LUANTTD_NATIVE_TRAM_PAID=1 LUANTTD_NATIVE_TRAM_FLEET=1 timeout 235 bash tests/campaign_worker_focus_native.sh
          BAYLINE_NATIVE_DISPLAY=306 BAYLINE_FOCUS_DEAD_END=depot timeout 220 bash tests/campaign_worker_focus_native.sh
          BAYLINE_NATIVE_DISPLAY=308 BAYLINE_NATIVE_PORT=46708 timeout 220 bash tests/campaign_worker_ride_native.sh
          BAYLINE_NATIVE_DISPLAY=311 BAYLINE_NATIVE_PORT=46711 timeout 140 bash tests/wildlife_native.sh
          BAYLINE_NATIVE_DISPLAY=318 BAYLINE_NATIVE_PORT=46718 timeout 130 bash tests/campaign_worker_farm_building_native.sh
          BAYLINE_NATIVE_TCP=1 BAYLINE_NATIVE_DISPLAY=319 BAYLINE_NATIVE_PORT=46719 LUANTTD_NATIVE_BANK_HEADS=1 timeout 130 bash tests/bridge_pier_render_native.sh
          BAYLINE_NATIVE_TCP=1 BAYLINE_NATIVE_DISPLAY=320 BAYLINE_NATIVE_PORT=46720 BAYLINE_NATIVE_ROCKY_WATER=1 timeout 130 bash tests/coastal_sheet_native.sh

  native-opening-bridges:
    name: Opening bridge family and paid service
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        style: [1, 2, 6, 7, 8]
    steps:
      - name: Install native test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gcc libc6-dev luanti luanti-server python3 xvfb x11-utils xauth xdotool imagemagick
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run occupied replacement, restart, fare and graphical replay
        env:
          BAYLINE_TEST_BRIDGE_STYLE: ${{ matrix.style }}
        run: |
          export PATH="/usr/games:$PATH"
          export TMPDIR="$(mktemp -d "$GITHUB_WORKSPACE/.opening-bridge.XXXXXX")"
          trap 'rm -rf -- "$TMPDIR"' EXIT
          if ((BAYLINE_TEST_BRIDGE_STYLE >= 6)); then
            bash tests/road_bridge_upgrade_native.sh
          fi
          bash tests/rail_fast_girder_worker.sh
          bash tests/fast_girder_graphical.sh

  rc1-parity:
    name: Compiled OpenTTD 16.0-RC1 comparisons
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install comparison tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 g++ python3-pil
      - name: Compare direct ports to the verified upstream tag
        env:
          OPENTTD_RC1_REV: 07b339c0aaeb0a87be9490b2f1c3f17c6b00b837
          GIT_TERMINAL_PROMPT: 0
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/OpenTTD-16.0-RC1"
          git clone --quiet --depth 1 --branch 16.0-RC1 https://github.com/OpenTTD/OpenTTD.git "$src"
          test "$(git -C "$src" rev-parse HEAD)" = "$OPENTTD_RC1_REV"
          python3 tests/opening_stock_bridge_catalog.py "$src"
          python3 tests/opening_stock_bridge_pieces.py "$src"
          python3 tests/news_rc1.py "$src"
          python3 tests/oil_rig_upstream.py "$src" lua5.1
          python3 tests/industry_build_scheduler_upstream.py "$src" lua5.1
          python3 tests/rotary_motion_upstream.py "$src" lua5.1
          python3 tests/stock_tricario_art.py "$src/src/table/engines.h" lua5.1
          python3 tests/advanced_rail_roster_upstream.py "$src/src/table/engines.h" lua5.1
          python3 tests/guideway_types_rc1.py "$src"
          python3 tests/road_dead_end_rc1.py "$src"
          python3 tests/road_remove_rc1.py "$src"
          python3 tests/road_town_permission_rc1.py "$src"
          python3 tests/road_stop_foundations_rc1.py "$src"
          python3 tests/farm_factory_fields_upstream.py "$src" --lua lua5.1
          python3 tests/farm_clear_rc1_upstream.py "$src/src/clear_cmd.cpp" --lua lua5.1
          python3 tests/terragenesis_clear_rc1_upstream.py "$src" --lua lua5.1
          lua5.1 tests/rocky_water_tiles.lua
          python3 tests/scenery_object_rc1_upstream.py "$src" --lua lua5.1
          lua5.1 tests/scenery_rocky_coast.lua
          lua5.1 tests/ship_facilities.lua
          lua5.1 tests/ship_water_world.lua
          lua5.1 tests/ship_preview_run.lua rocks
          /usr/bin/python3 tests/stock_rocky_water_art.py
          /usr/bin/python3 tests/heliport_art.py
          python3 tests/airport_heliport_rc1.py "$src" --lua lua5.1
          lua5.1 tests/oil_rig_helicopter.lua heliport
          lua5.1 tests/airport_heliport_paid.lua
          /usr/bin/python3 tests/rotary_airfield_art.py
          python3 tools/build_rotary_ground_airports.py "$src/src/table"
          lua5.1 tests/airport_rotary_ground_motion.lua
          lua5.1 tests/airport_rotary_ground_paid.lua
          python3 tests/stock_dash_art.py --upstream-engines "$src/src/table/engines.h"
          python3 tests/stock_tim_art.py --upstream-engines "$src/src/table/engines.h"
          python3 tests/stock_tim_art.py --variant asiastar --upstream-engines "$src/src/table/engines.h"
          python3 tests/yate_haugan_art.py --engines "$src/src/table/engines.h"
          python3 tests/airport_city_airframes_rc1.py "$src/src/table/engines.h"
          python3 tools/build_stock_temperate_inventory.py "$src/src/table/engines.h"
