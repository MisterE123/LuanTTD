name: LuanTTD tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lua and headless Luanti
    runs-on: ubuntu-24.04
    container: debian:13
    env:
      LUA: lua5.1
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - name: Install test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git lua5.1 luanti luanti-server python3 python3-pil zstd xvfb x11-utils xauth xdotool imagemagick
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Lua syntax and run focused tests
        run: |
          find mods/luanttd_core -type f -name '*.lua' -print0 | xargs -0 -r -n 1 luac5.1 -p
          for t in sim pedestrian pedestrian_dock sightseeing_hangar ambient_storms avatar_car player_return cinematic_view ambient_wildlife wildlife_motion world_place_labels ambient_shop_traffic survey_sightseeing campaign_landscape_async campaign_simulation_bindings campaign_company_guide campaign_authority_endpoint campaign_authority_projection campaign_authority_interest campaign_projection_painter campaign_paint_tops campaign_snapshot_scene campaign_authority_host campaign_build_proxy campaign_projected_actors campaign_passenger_projection campaign_worker_finance_ui campaign_news_road campaign_worker_depot_ui campaign_worker_fleet_ui authority_terrain_view campaign_transport_commands presentation_interest world_setup generated_world_dimensions packed_campaign workbench_index business_tutorials original_terrain_explorer_gate jump_map atmosphere industry_smoke_view hotbar hotbar_task_flows vehicle_ui road_live_order_edit tram_live_order_edit water_air_orders ordinary_level_crossing road_remove_long road_remove_world tram_remove_world tram_drag tram_grade_surface tram_grade_service tram_span_layers road_town_permission road_stop_build_rc1 road_stop_area road_stop_members road_stop_area_route road_stop_area_worker road_auto_terminal road_facility_underpasses road_mixed_station road_station_retirement station_join_picker road_waypoint_build road_waypoint_service \
            bridge_picker bridge_underlay bridge_piece_art road_bridge_ground_clear bridge_coastal_ramps bridge_water_facilities bridge_rail_facilities ship_aqueduct_world road_bridge_upgrade rail_span rail_span_run rail_bridge_catenary_selector generated_coast_dock \
            coastal_corridor_seed coastal_corridor_freight generated_oil_placement mixed_freight_live farm_field_view crop_growth_view rail_owned_default \
            rail_depot_fleet rail_depot_construction rail_shore_build rail_loose_wagons rail_order_cargo rail_owned_ui rail_goods_owned_ui rail_oil_world_ui rail_grade_signals \
            road_bay_live road_terminus_town_limits rail_owned_service rail_owned_multi rail_paid_runtime rail_signal_ui rail_signal_curve rail_block_signals rail_block_dispatch rail_reverse rail_collision rail_accident_rating rail_station_placement rail_preview rail_diagonal rail_body_spacing rail_dispatch_view passenger_crowd passenger_terminal_crowd ship_preview_view; do
            lua5.1 "tests/$t.lua"
          done
          for t in rail_guideway_bogies railtype_worker_cache rail_advanced_stock_purchase rail_typed_construction_runtime rail_gauge_conversion; do
            lua5.1 "tests/$t.lua"
          done
          lua5.1 tests/ground_vehicle_flood.lua
          lua5.1 tests/station_rating_runtime.lua
          lua5.1 tests/depot_orientation.lua
          lua5.1 tests/road_proximity.lua
          lua5.1 tests/stock_road_coast.lua
          lua5.1 tests/road_traffic_runtime.lua
          lua5.1 tests/tram_preview_run.lua
          lua5.1 tests/tram_shared_road_live.lua
          lua5.1 tests/tram_shared_station.lua
