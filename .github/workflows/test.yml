  mixed-town-parity:
    name: OpenTTD RC1 mixed town parity
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 9
    steps:
      - name: Install Lua and Luanti server
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git lua5.1 luanti-server python3
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compete, load, rate, and move in the original order
        run: |
          set -eu
          lua5.1 tests/object_pool_rc1.lua
          lua5.1 tests/rail_auto_service_rc1.lua
          lua5.1 tests/town_growth_rc1_station_phase.lua
          lua5.1 tests/town_growth_rc1_generated_region.lua
          lua5.1 tests/town_growth_rc1_generated_region.lua rivers
          lua5.1 tests/town_growth_rc1_industry_live.lua
          lua5.1 tests/town_growth_rc1_vehicle_phase.lua
          lua5.1 tests/town_growth_rc1_two_buses.lua
          lua5.1 tests/town_growth_rc1_mixed_road_rail.lua
          lua5.1 tests/town_growth_rc1_ordinary_train.lua
          lua5.1 tests/station_stop_order_rc1.lua
          lua5.1 tests/town_growth_rc1_fast_grid.lua
          lua5.1 tests/town_growth_rc1_fast_grid.lua better
          lua5.1 tests/town_growth_rc1_fast_grid.lua random
          lua5.1 tests/town_tunnel_excavation.lua
          lua5.1 tests/industry_generated_tree_clear.lua
          lua5.1 tests/generated_town_grade_spans.lua
      - name: Restart ordinary train mid-service in native Luanti
        run: bash tests/town_growth_rc1_ordinary_train_native.sh
      - name: Restart the shared-depot Goods circuit in native Luanti
        run: bash tests/town_growth_rc1_goods_native.sh shared
      - name: Restart a rectangular Fast-growth region in native Luanti
        run: bash tests/town_growth_rc1_goods_native.sh grid
      - name: Excavate a town road-tunnel exit in native Luanti
        run: bash tests/town_tunnel_excavation_native.sh


  rc1-wooded-hill-town-parity:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 10
    steps:
      - name: Install Lua and Luanti server
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git lua5.1 luanti-server python3
          echo /usr/games >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare a full year of rocky shore and steep town growth
        run: lua5.1 tests/town_growth_rc1_fast_grid.lua hills
      - name: Restart the same hills profile in native Luanti
        run: bash tests/town_growth_rc1_goods_native.sh hills
      - name: Compare three years across stock house retirement dates
        run: |
          lua5.1 tests/town_growth_rc1_fast_grid.lua hills-long
          bash tests/town_growth_rc1_goods_native.sh hills-long
      - name: Verify live world-growth setting changes
        run: |
          lua5.1 tests/campaign_worker_finance_ui.lua
          lua5.1 tests/town_growth_rc1_fast_grid.lua midyear
          bash tests/town_growth_rc1_goods_native.sh midyear

  rc1-town-cargo-and-cities:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 10
    steps:
      - name: Install Lua and Luanti server
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git lua5.1 luanti-server
          echo /usr/games >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare stock Quadratic production and live settings
        run: |
          lua5.1 tests/world_setup.lua
          lua5.1 tests/campaign_worker_finance_ui.lua
          lua5.1 tests/town_growth_rc1_fast_grid.lua quadratic
          bash tests/town_growth_rc1_goods_native.sh quadratic
      - name: Compare live housing with municipal road construction off
        run: |
          lua5.1 tests/town_growth_rc1_fast_grid.lua houses
          bash tests/town_growth_rc1_goods_native.sh houses
      - name: Check growth service after removing the last stop
        run: |
          lua5.1 tests/road_station_retirement.lua
          lua5.1 tests/dock_station_join.lua
          LUANTTD_QA_MUNICIPAL_KIND=retired bash tests/town_municipal_roads_native.sh "$(command -v luantiserver)" /tmp/rc1-retired-station
          LUANTTD_QA_MUNICIPAL_KIND=reopened bash tests/town_municipal_roads_native.sh "$(command -v luantiserver)" /tmp/rc1-reopened-station
          lua5.1 tests/rail_station_reopen_rc1.lua
          LUANTTD_QA_MUNICIPAL_KIND=rail-reopened bash tests/town_municipal_roads_native.sh "$(command -v luantiserver)" /tmp/rc1-rail-reopened-station
          lua5.1 tests/airport_station_reopen_rc1.lua
          LUANTTD_QA_MUNICIPAL_KIND=air-reopened bash tests/town_municipal_roads_native.sh "$(command -v luantiserver)" /tmp/rc1-air-reopened-station
      - name: Compare three years of dense 1993 grid cities
        run: lua5.1 tests/town_growth_rc1_fast_grid.lua crowded


  rc1-wide-town-growth-parity:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 8
    steps:
      - name: Install Lua and Luanti server
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git lua5.1 luanti-server
          echo /usr/games >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify paid founding and follow the new city across an RC1 year
        run: |
          lua5.1 tests/world_setup.lua
          lua5.1 tests/campaign_worker_finance_ui.lua
          lua5.1 tests/town_founding_ui.lua
          lua5.1 tests/town_founding_rc1.lua
          bash tests/town_growth_rc1_goods_native.sh founding
      - name: Compare founding a city during live bus and freight service
        run: lua5.1 tests/town_growth_rc1_corridor.lua founded
      - name: Compare live aircraft and town growth against stock through year end
        run: |
          lua5.1 tests/aircraft_accident_rc1.lua
          lua5.1 tests/town_growth_rc1_corridor.lua air
          lua5.1 tests/town_growth_rc1_corridor.lua air-crash
          lua5.1 tests/stock_joined_station_members.lua
          lua5.1 tests/stock_mixed_airport_join_command.lua
          lua5.1 tests/stock_mixed_station_catchment.lua
          lua5.1 tests/stock_mixed_station_loading.lua
          lua5.1 tests/stock_mixed_airport_world.lua
          lua5.1 tests/town_growth_rc1_corridor.lua air-joint
          lua5.1 tests/town_growth_rc1_corridor.lua air-joint-full
          bash tests/stock_mixed_airport_worker_native.sh
      - name: Compare live joined rail and bus station growth against stock
        run: |
          lua5.1 tests/stock_mixed_rail_world.lua
          lua5.1 tests/stock_train_implicit_orders.lua
          lua5.1 tests/town_growth_rc1_corridor.lua rail-joint
          lua5.1 tests/town_growth_rc1_corridor.lua rail-intermediate
          lua5.1 tests/town_growth_rc1_corridor.lua rail-intermediate-learned
          bash tests/stock_mixed_rail_worker_native.sh
          bash tests/stock_mixed_rail_worker_native.sh intermediate
      - name: Compare one bus, railway and airport station against OpenTTD RC1
        run: |
          lua5.1 tests/stock_triple_station_world.lua
          lua5.1 tests/town_growth_rc1_corridor.lua triple-station
          bash tests/stock_mixed_airport_worker_native.sh triple
      - name: Check ordinary ferry effects on the full RC1 coastal year
        run: |
          lua5.1 tests/ship_rc1_lane_costs.lua
          lua5.1 tests/town_growth_rc1_ferry.lua
          bash tests/town_growth_rc1_ferry_native.sh
      - name: Compare a shared passenger dock and bus stop against RC1
        run: |
          lua5.1 tests/dock_station_join.lua
          lua5.1 tests/road_loading_runtime.lua
          lua5.1 tests/town_growth_rc1_ferry.lua mixed
          bash tests/town_growth_rc1_ferry_native.sh mixed
      - name: Check road-tip replacement and growth across municipal boundaries
        run: |
          lua5.1 tests/town_municipal_roads.lua
          lua5.1 tests/town_growth_live.lua
          LUANTTD_QA_MUNICIPAL_KIND=underbridge bash tests/town_municipal_roads_native.sh "$(command -v luantiserver)" /tmp/rc1-municipal-underbridge
          LUANTTD_QA_MUNICIPAL_KIND=abovetunnel bash tests/town_municipal_roads_native.sh "$(command -v luantiserver)" /tmp/rc1-municipal-abovetunnel
          for scenario in underbridge-extend abovetunnel-extend; do
            LUANTTD_QA_MUNICIPAL_KIND="$scenario" bash tests/town_municipal_roads_native.sh "$(command -v luantiserver)" "/tmp/rc1-municipal-$scenario"
          done
          lua5.1 tests/town_rebuild.lua
          LUANTTD_QA_MUNICIPAL_KIND=renewbore bash tests/town_municipal_roads_native.sh "$(command -v luantiserver)" /tmp/rc1-municipal-renewbore
          LUANTTD_QA_MUNICIPAL_KIND=renewbore-replace bash tests/town_municipal_roads_native.sh "$(command -v luantiserver)" /tmp/rc1-municipal-renewbore-replace
          lua5.1 tests/water_flood.lua
          lua5.1 tests/town_growth_rc1_fast_grid.lua wide
          bash tests/town_growth_rc1_goods_native.sh wide
